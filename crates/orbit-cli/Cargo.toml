[package]
name = "orbit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The package crate is internal; the single public executable is `orbit`.
[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
orbit-runtime = { path = "../orbit-runtime" }
orbit-blueprint = { path = "../orbit-blueprint" }
clap = { version = "4.5", features = ["derive", "env"] }
orbit-domain = { path = "../orbit-domain" }
orbit-client = { path = "../orbit-client" }
orbit-application = { path = "../orbit-application" }
orbit-storage = { path = "../orbit-storage" }
orbit-progress = { path = "../orbit-progress" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"


[dev-dependencies]
tempfile = "3"
