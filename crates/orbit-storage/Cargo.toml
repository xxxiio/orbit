[package]
name = "orbit-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orbit-domain = { path = "../orbit-domain" }
orbit-blueprint = { path = "../orbit-blueprint" }
orbit-application = { path = "../orbit-application" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

orbit-progress = { path = "../orbit-progress" }

[dev-dependencies]
orbit-planner = { path = "../orbit-planner" }
