[package]
name = "orbit-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orbit-blueprint = { path = "../orbit-blueprint" }
orbit-application = { path = "../orbit-application" }
orbit-runtime = { path = "../orbit-runtime" }
orbit-domain = { path = "../orbit-domain" }
orbit-sync = { path = "../orbit-sync" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
